[project]
name = "software-cup-a3-backend"
version = "0.1.0"
description = "Backend foundation for the Software Cup A3 multi-agent learning system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3,<1.0",
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "starlette>=0.49.1",
]

[tool.setuptools.packages.find]
where = ["src/backend"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
